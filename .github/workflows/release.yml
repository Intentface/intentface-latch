name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # mint the OIDC token npm authenticates the publish with
    steps:
      # Pinned by commit SHA, not by tag. Tags are mutable, and
      # `changesets/action@v1` is a *branch* — `@v1` ran whatever that
      # repository pointed there on the day the job started, in the one job
      # allowed to publish. The trailing comment is the human-readable
      # version, and what Renovate/Dependabot bump.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # changesets needs history to diff against baseBranch

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc auth line that publishing needs. No `scope:` here
          # on purpose — the target IS the default registry, so scoping would
          # only add a redundant mapping.
          registry-url: https://registry.npmjs.org

      # Only packages/* and the workspace root — the release builds, tests and
      # publishes libraries, so an app's dependencies are dead weight here.
      - run: pnpm install --frozen-lockfile --filter "./packages/**" --filter "."

      # Gate the release on what actually ships. A broken build must never reach
      # the registry — a published version can be deprecated but not replaced,
      # and on the public registry it can only be unpublished within 72 hours.
      # Scoped to packages/* on purpose: an app's typecheck failing shouldn't
      # block a library release, and apps are not published from here.
      #
      # `pnpm release` re-runs all four (so a direct invocation can't skip them),
      # but they run here as separate steps for legible per-check CI output and
      # to fail before the changesets action does any work. Turbo caches, so the
      # second pass costs almost nothing.
      - run: pnpm typecheck:packages
      - run: pnpm test
      - run: pnpm build

      # Packs every package and asserts each `exports` target exists in the
      # tarball. Catches the publish-shape bugs that are invisible in a
      # workspace — see RELEASING.md.
      - run: pnpm verify:publish

      # Trusted publishing needs npm 11.5.1 or later, and the CLI bundled with
      # setup-node is older. Pinned, not `@latest`: npm 12 requires Node
      # ^22.22.2 || ^24.15.0 || >=26, so a moving tag can break this job on a
      # runner image we did not choose. 11.18.0 is the version the bootstrap
      # was performed with.
      - run: npm install -g npm@11.18.0

      # With changesets present: opens/updates a version PR.
      # With none (the version PR just merged): publishes.
      #
      # v2, not v1. v1 learned what `changeset publish` had published by parsing
      # its stdout for `New tag:` lines, and @changesets/cli v3 no longer prints
      # them — so the 0.10.0 run published all ten packages and then, believing
      # nothing had shipped, pushed no tags and created no releases. v2 reads a
      # shared output file instead. It also pushes through the GitHub API and
      # wants the token as an input, not the environment.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # No npm credential. The publish authenticates through npm's OIDC
        # trusted publishing: this job mints a short-lived identity token
        # (`id-token: write` above) and npm checks it against the publisher
        # authorized on each package — repository `Intentface/intentface-latch`,
        # workflow file `release.yml`. Nothing to rotate, nothing to leak.
        #
        # This cannot bootstrap itself: npm will not let you authorize a
        # publisher for a package that does not exist, so the first publish of
        # each package was done by hand. See RELEASING.md.
        #
        # NOT set: NPM_CONFIG_PROVENANCE. npm rejects provenance from private
        # source repositories — the publish fails rather than degrading. If
        # this repository goes public it is one line here.
