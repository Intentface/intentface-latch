name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push tags
      pull-requests: write # open/update the "Version Packages" PR
    steps:
      # Pinned by commit SHA, not by tag. Tags are mutable, and
      # `changesets/action@v1` is a *branch* — `@v1` ran whatever that
      # repository pointed there on the day the job started, in the one job
      # that holds an npm credential. The trailing comment is the human-
      # readable version, and what Renovate/Dependabot bump.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # changesets needs history to diff against baseBranch

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          # Writes the .npmrc auth line that publishing needs. No `scope:` here
          # on purpose — the target IS the default registry, so scoping would
          # only add a redundant mapping.
          registry-url: https://registry.npmjs.org

      # Only packages/* and the workspace root — the release builds, tests and
      # publishes libraries, so an app's dependencies are dead weight here.
      - run: pnpm install --frozen-lockfile --filter "./packages/**" --filter "."

      # Gate the release on what actually ships. A broken build must never reach
      # the registry — a published version can be deprecated but not replaced,
      # and on the public registry it can only be unpublished within 72 hours.
      # Scoped to packages/* on purpose: an app's typecheck failing shouldn't
      # block a library release, and apps are not published from here.
      #
      # `pnpm release` re-runs all four (so a direct invocation can't skip them),
      # but they run here as separate steps for legible per-check CI output and
      # to fail before the changesets action does any work. Turbo caches, so the
      # second pass costs almost nothing.
      - run: pnpm typecheck:packages
      - run: pnpm test
      - run: pnpm build

      # Packs every package and asserts each `exports` target exists in the
      # tarball. Catches the publish-shape bugs that are invisible in a
      # workspace — see RELEASING.md.
      - run: pnpm verify:publish

      # With changesets present: opens/updates a version PR.
      # With none (the version PR just merged): publishes.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A granular npm token, scoped to @intentface with read/write and
          # **2FA bypass** on — without the bypass this hangs on an OTP prompt.
          # Classic/automation tokens were revoked in December 2025.
          #
          # Granular write tokens expire in 90 days or less, so this is meant to
          # be temporary: once the packages exist on npm, authorize this
          # workflow as a trusted publisher on each of them and switch to OIDC
          # (add `id-token: write`, upgrade the npm CLI to >= 11.5.1, drop this
          # secret). RELEASING.md has the steps.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NOT set: NPM_CONFIG_PROVENANCE. npm stopped accepting provenance
          # from private source repositories in July 2023 — the registry
          # rejects the bundle with "Unsupported GitHub Actions source
          # repository visibility", failing the publish. The day this repo goes
          # public, add `id-token: write` to `permissions` above and
          # `NPM_CONFIG_PROVENANCE: "true"` here; nothing else is needed, since
          # `verify:publish` already enforces the `repository` field it wants.
